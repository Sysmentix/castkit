name: Publish Packages to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version Bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch' # 1.0.1 -> 1.0.2 (Bug fixes & small improvements)
          - 'minor' # 1.0.1 -> 1.1.0 (New features, backward compatible)
          - 'major' # 1.0.1 -> 2.0.0 (Breaking API changes)
          - 'none'  # Keep current version in package.json
      target:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'castkit-server'
          - 'castkit-client'

permissions:
  contents: write   # Required to commit version bumps, push git tags, and create releases
  id-token: write   # Required for npm provenance cryptographic signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: 🔢 Auto-increment Version (if requested)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'none' }}
        id: versioning
        run: |
          BUMP="${{ github.event.inputs.bump }}"
          TARGET="${{ github.event.inputs.target }}"
          
          echo "Bumping versions with mode: $BUMP on target: $TARGET"
          
          # Bump packages based on target
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "castkit-server" ]; then
            cd packages/server && npm version "$BUMP" --no-git-tag-version && cd ../..
          fi
          
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "castkit-client" ]; then
            cd packages/client && npm version "$BUMP" --no-git-tag-version && cd ../..
          fi

          # Read latest version
          if [ "$TARGET" = "castkit-client" ]; then
            NEW_VER=$(node -p "require('./packages/client/package.json').version")
          else
            NEW_VER=$(node -p "require('./packages/server/package.json').version")
          fi
          
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT
          
          # Git configuration
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          git add packages/
          git commit -m "chore(release): bump version to v${NEW_VER} [skip ci]"
          git tag "v${NEW_VER}"
          git push origin main
          git push origin "v${NEW_VER}"

      - name: 🔐 Authenticate with npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build All Packages
        run: npm run build

      - name: 🚀 Publish castkit-server
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'castkit-server' }}
        run: |
          npm publish --workspace=castkit-server --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Publish castkit-client
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'castkit-client' }}
        run: |
          npm publish --workspace=castkit-client --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🏷️ Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'none' }}
        run: |
          TAG="v${{ steps.versioning.outputs.new_version }}"
          gh release create "$TAG" --title "Release $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

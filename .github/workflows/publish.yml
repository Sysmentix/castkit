name: Publish Packages to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'castkit-server'
          - 'castkit-client'

permissions:
  contents: write
  id-token: write # Required for npm provenance cryptographic signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build All Packages
        run: npm run build

      - name: 🚀 Publish castkit-server
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'castkit-server' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          npm publish --workspace=castkit-server --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Publish castkit-client
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'castkit-client' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          npm publish --workspace=castkit-client --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
